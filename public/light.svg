<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <radialGradient id="bulbGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff7c7"/>
      <stop offset="65%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#f4b83f"/>
    </radialGradient>
  </defs>

  <!-- lamp cap -->
  <rect x="270" y="55" width="60" height="35" rx="8" fill="#303236"/>
  <rect x="250" y="85" width="100" height="35" rx="12" fill="#303236"/>

  <!-- shade -->
  <path d="M90 250 Q300 120 510 250 L535 300 Q300 340 65 300 Z" fill="#34363a"/>
  <ellipse cx="300" cy="300" rx="235" ry="35" fill="#f7edcf"/>
  <path d="M65 300 Q300 340 535 300" fill="none" stroke="#26282b" stroke-width="4"/>

  <!-- large bulb -->
  <circle cx="300" cy="350" r="70" fill="url(#bulbGlow)" opacity="0.95"/>
  <path d="M285 320 L285 375 M300 315 L300 380 M315 320 L315 375" 
        stroke="#fff8dc" stroke-width="5" stroke-linecap="round"/>
  <path d="M285 375 Q300 395 315 375" fill="none" stroke="#fff8dc" stroke-width="5"/>

  <!-- subtle bulb neck -->
  <rect x="288" y="290" width="24" height="25" rx="5" fill="#e9b64f"/>
</svg>
