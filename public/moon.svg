<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Glowing crescent moon</title>
  <desc id="desc">A warm yellow crescent moon with a soft golden glow on a transparent background.</desc>
  <defs>
    <radialGradient id="moon" cx="63%" cy="45%" r="67%">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.55" stop-color="#fff47d"/>
      <stop offset="1" stop-color="#f4cc35"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffbc1"/>
      <stop offset="1" stop-color="#ffe54f"/>
    </linearGradient>
    <filter id="aura" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shine" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <mask id="crescent">
      <rect width="800" height="800" fill="black"/>
      <circle cx="415" cy="400" r="270" fill="white"/>
      <circle cx="288" cy="302" r="267" fill="black"/>
    </mask>
  </defs>

  <!-- The asset has no background: it can be placed over any color. -->
  <g mask="url(#crescent)">
    <circle cx="415" cy="400" r="280" fill="#f8dd36" opacity=".82" filter="url(#aura)"/>
    <circle cx="415" cy="400" r="270" fill="url(#moon)"/>
    <circle cx="415" cy="400" r="269" fill="none" stroke="url(#rim)" stroke-width="5" opacity=".85"/>

    <!-- Subtle vector crater texture. Remove this group for a flat icon. -->
    <g fill="#e7bb29" opacity=".16" filter="url(#shine)">
      <circle cx="487" cy="302" r="19"/><circle cx="558" cy="403" r="13"/>
      <circle cx="468" cy="514" r="22"/><circle cx="394" cy="592" r="14"/>
      <circle cx="569" cy="541" r="10"/><circle cx="518" cy="641" r="17"/>
      <circle cx="615" cy="466" r="8"/><circle cx="432" cy="216" r="10"/>
    </g>
    <g fill="#fffdf0" opacity=".23">
      <circle cx="525" cy="357" r="7"/><circle cx="449" cy="453" r="8"/>
      <circle cx="534" cy="585" r="6"/><circle cx="400" cy="539" r="5"/>
    </g>
  </g>
</svg>
